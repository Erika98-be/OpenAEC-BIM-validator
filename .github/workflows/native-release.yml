name: Native desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      signed:
        description: 'Use platform certificates (required for tagged releases)'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libudev-dev pkg-config
      - name: Check tag matches package
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,tomllib; v=tomllib.load(open('native/Cargo.toml','rb'))['package']['version']; assert os.environ['RELEASE_TAG']=='v'+v, 'Tag/package version mismatch'"
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-features --locked --target ${{ matrix.target }}
      - run: cargo clippy --workspace --all-features --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Black-box protocol tests (Unix)
        if: runner.os != 'Windows'
        run: python scripts/test-native-protocols.py target/${{ matrix.target }}/release/openaec-bim-validator
      - name: Black-box protocol tests (Windows)
        if: runner.os == 'Windows'
        run: python scripts/test-native-protocols.py target/${{ matrix.target }}/release/openaec-bim-validator.exe
      - name: Stage application and notices
        run: python scripts/package-native.py --target ${{ matrix.target }} --stage-only
      - name: Authenticode sign and verify
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || inputs.signed)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/sign-windows.ps1
      - name: Developer ID sign, notarize and verify
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/') || inputs.signed)
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/sign-macos.sh
      - name: Archive signed files and calculate checksums
        run: python scripts/package-native.py --target ${{ matrix.target }} --archive-only
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - name: Publish release candidate with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "OpenAEC BIM Validator $RELEASE_TAG" --notes-file release/NOTES.md
