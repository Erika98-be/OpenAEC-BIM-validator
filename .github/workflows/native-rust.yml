name: Native Rust viewer
on:
  push:
    paths: ['native/**', 'Cargo.toml', 'Cargo.lock', 'test/fixtures/**', '.github/workflows/native-rust.yml']
  pull_request:
    paths: ['native/**', 'Cargo.toml', 'Cargo.lock', 'test/fixtures/**', '.github/workflows/native-rust.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: openaec-bim-validator-linux
          path: target/release/openaec-bim-validator
