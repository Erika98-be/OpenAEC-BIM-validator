[package]
name = "openaec-bim-validator"
version = "0.3.0-rc.1"
edition = "2021"
description = "Native Rust IFC viewer and model checker with the IfcLite kernel"

[features]
screenshot = ["dep:image"]

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
egui_glow = "=0.31.1"
glam = { version = "0.30", features = ["serde"] }
ifc-lite-core = "=20.4.0"
ifc-lite-geometry = "=20.4.0"
rustc-hash = "2.1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = "1"
roxmltree = "0.20"
regex = "1"

zip = { version = "2.4", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
ifc-lite-clash = "=20.4.0"
pointcloud-core = { git = "https://github.com/OpenAEC-Foundation/open-pointcloud-studio", rev = "13b199a426e692d2149998b3f2f596a191568501" }
nalgebra = "0.35"
axum = "=0.8.9"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros"] }
tokio-util = "0.7"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
base64 = "0.22"
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client"] }
